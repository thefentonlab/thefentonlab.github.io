pi:
  name: Julie Fenton
  title: Assistant Professor of Chemistry, Penn State
  photo: people/julie.jpg
  bio: >
    Julie is a synthetic materials chemist. Her work addresses bottlenecks in making
    and understanding inorganic, organic, and hybrid solids. She grew up in Lancaster,
    Pennsylvania, and earned a BS from Messiah College and a PhD with Raymond Schaak
    at Penn State. Before joining the faculty she held an Arnold O. Beckman
    Postdoctoral Fellowship at Northwestern with William Dichtel, working on
    crystalline porous polymers. Outside lab she enjoys cross training, trivia,
    travel, and time with her family and her dog Chili.

